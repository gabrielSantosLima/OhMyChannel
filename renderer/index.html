<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' file: data:; style-src 'self'; script-src 'self'"
    />
    <title>OhMyChannel</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <img class="logo" src="../assets/icon.png" alt="OhMyChannel" />
        <h1>OhMyChannel</h1>
      </div>
      <div class="auth">
        <button
          id="themeBtn"
          class="icon-btn"
          title="Alternar tema"
          aria-label="Alternar tema"
        >
          <svg
            class="icon-sun"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
          <svg
            class="icon-moon"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        </button>
        <span id="authStatus" class="status off">Desconectado</span>
        <button id="loginBtn" class="ghost">Entrar com Google</button>
        <button id="logoutBtn" class="ghost hidden">Sair</button>
      </div>
    </header>

    <main>
      <section class="field">
        <label>Video</label>
        <div class="row">
          <button id="pickBtn">Escolher arquivo</button>
          <span id="fileName" class="muted">Nenhum arquivo selecionado</span>
        </div>
      </section>

      <section class="field">
        <label for="title">Titulo</label>
        <input id="title" type="text" maxlength="100" placeholder="Titulo do video" />
        <span id="titleCount" class="counter">0 / 100</span>
      </section>

      <section class="field">
        <label for="description">Descricao</label>
        <textarea
          id="description"
          maxlength="5000"
          rows="6"
          placeholder="Descricao do video"
        ></textarea>
        <span id="descCount" class="counter">0 / 5000</span>
      </section>

      <section class="field">
        <button id="uploadBtn" class="primary" disabled>Enviar para o YouTube</button>
        <div class="progress hidden" id="progressWrap">
          <div class="bar"><div id="progressBar"></div></div>
          <span id="progressText">0%</span>
        </div>
      </section>

      <p id="message" class="message"></p>
    </main>

    <script src="renderer.js"></script>
  </body>
</html>
