<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' file: data:; style-src 'self'; script-src 'self'"
    />
    <title>OhMyChannel</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <img class="logo" src="../assets/icon.png" alt="OhMyChannel" />
        <h1>OhMyChannel</h1>
      </div>
      <div class="auth">
        <button
          id="themeBtn"
          class="icon-btn"
          title="Toggle theme"
          aria-label="Toggle theme"
        >
          <svg
            class="icon-sun"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
          <svg
            class="icon-moon"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        </button>
        <span id="authStatus" class="status off">Disconnected</span>
        <button id="loginBtn" class="ghost">Sign in with Google</button>
        <button id="logoutBtn" class="ghost hidden">Sign out</button>
      </div>
    </header>

    <main>
      <div class="toolbar">
        <button id="addBtn" class="primary">Add videos</button>
        <button id="uploadAllBtn">Upload all</button>
        <button id="templatesBtn" class="ghost">Title templates</button>
        <span id="queueInfo" class="muted"></span>
      </div>

      <div id="queue" class="queue"></div>
      <div id="emptyQueue" class="empty-queue">
        No videos in the queue. Click "Add videos" to select one or more files.
      </div>

      <p id="message" class="message"></p>
    </main>

    <div id="templatesModal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-head">
          <h2>Title templates</h2>
          <button id="templatesClose" class="icon-btn" aria-label="Close">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="tpl-form">
            <input id="tplName" type="text" placeholder="Template name (e.g. gameplay)" />
            <input id="tplParams" type="text" placeholder="Parameters, comma separated (e.g. game,episode)" />
            <input id="tplTitle" type="text" placeholder="Pattern (e.g. {game} #{episode})" />
            <button id="tplAdd" class="primary">Add template</button>
            <span id="tplError" class="tpl-error"></span>
          </div>
          <div id="tplList" class="tpl-list"></div>
        </div>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
